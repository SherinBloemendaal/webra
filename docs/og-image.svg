<?xml version="1.0" encoding="UTF-8"?>
<!--
  Link preview image (og:image, twitter:image): the left part of banner.svg cut
  to the 1200x630 shape link previews use, with the frame closed on the right.
  Render with: rsvg-convert docs/og-image.svg -o apps/website/assets/og.png
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 762 400" width="1200" height="630">
  <image href="banner.svg" xlink:href="banner.svg" x="0" y="0" width="1280" height="400"/>
  <rect x="6" y="6" width="750" height="388" fill="none" stroke="#c41a12" stroke-width="4"/>
  <rect x="14" y="14" width="734" height="372" fill="none" stroke="#5a1410" stroke-width="2"/>
</svg>
