# Excerpt of OpenRA mods/ra/rules/husks.yaml: the wrecks ground vehicles leave
# (SpawnActorOnDeath in vehicles.yaml; they inherit ^Husk from defaults.yaml).
# Aircraft husks fall and explode (engine plane.rs, helicopter.rs) and are
# not listed. Not buildable: tools/gen_rules.py resolves them (EXTRA_ACTORS)
# through parse.py.

2TNK.Husk:
	Inherits: ^Husk
	Tooltip:
		Name: actor-2tnk-husk-name
	ThrowsParticle@turret:
		Anim: turret
	TransformOnCapture:
		IntoActor: 2tnk
	InfiltrateForTransform:
		IntoActor: 2tnk
	RenderSprites:
		Image: 2tnk.destroyed

