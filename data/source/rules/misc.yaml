# Excerpt of OpenRA mods/ra/rules/misc.yaml: the mines laid by the Minelayer
# (they inherit ^Mine from defaults.yaml) and the crates (^Crate, dropped by
# the CrateSpawner of world.yaml). Not buildable, so they are not in
# data/actors.json; tools/gen_rules.py resolves them (EXTRA_ACTORS) through parse.py.

MINP:
	Inherits: ^Mine
	FireWarheadsOnDeath:
		Weapon: APMine

MINV:
	Inherits: ^Mine
	FireWarheadsOnDeath:
		Weapon: ATMine

CRATE:
	Inherits: ^Crate
	GiveCashCrateAction:
		Amount: 1000
		SelectionShares: 50
		UseCashTick: true
	LevelUpCrateAction:
		SelectionShares: 40
	ExplodeCrateAction@fire:
		Weapon: CrateNapalm
		SelectionShares: 5
	ExplodeCrateAction@boom:
		Weapon: CrateExplosion
		SelectionShares: 5
	HideMapCrateAction:
		SelectionShares: 5
		Sequence: hide-map
	HealActorsCrateAction:
		Sound: heal2.aud
		SelectionShares: 2
		Sequence: heal
	RevealMapCrateAction:
		SelectionShares: 1
		Sequence: reveal-map
	DuplicateUnitCrateAction:
		SelectionShares: 10
		MaxAmount: 5
		MinAmount: 1
		MaxDuplicateValue: 1500
		ValidTargets: GroundActor, WaterActor, Submarine
	GiveBaseBuilderCrateAction:
		SelectionShares: 0
		NoBaseSelectionShares: 100
		Units: mcv
	GiveUnitCrateAction@jeep:
		SelectionShares: 6
		Units: jeep
		ValidFactions: allies, england, france, germany
		Prerequisites: techlevel.low
	GiveUnitCrateAction@1tnk:
		SelectionShares: 6
		Units: 1tnk
		ValidFactions: allies, england, france, germany
		Prerequisites: techlevel.low
	GiveUnitCrateAction@apc:
		SelectionShares: 6
		Units: apc
		ValidFactions: soviet, russia, ukraine
		Prerequisites: techlevel.low
	GiveUnitCrateAction@ftrk:
		SelectionShares: 6
		Units: ftrk
		ValidFactions: soviet, russia, ukraine
		Prerequisites: techlevel.low
	GiveUnitCrateAction@arty:
		SelectionShares: 5
		Units: arty
		ValidFactions: allies, england, france, germany
		Prerequisites: techlevel.medium, dome
	GiveUnitCrateAction@v2rl:
		SelectionShares: 5
		Units: v2rl
		ValidFactions: soviet, russia, ukraine
		Prerequisites: techlevel.medium, dome
	GiveUnitCrateAction@2tnk:
		SelectionShares: 4
		Units: 2tnk
		ValidFactions: allies, england, france, germany
