name: Release

# Semantic versioning from Conventional Commits: release-please keeps a release
# PR open with the next version and changelog; merging it tags the release.
on:
  push:
    branches: [main]

# Read only by default; the job below asks for what it needs.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Writes the release PR's branch, tags and releases (contents) and opens
    # or updates the release PR (pull-requests). Runs only on pushes to main,
    # never for pull requests.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps the versions in package.json and Cargo.toml but
      # not in the lock files; bring them along on the release PR's branch so
      # main never carries lock files a version behind.
      - name: Sync lock files on the release PR
        if: steps.release.outputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.release.outputs.pr
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.release.outputs.pr
        with:
          toolchain: stable

      - name: Commit synced lock files
        if: steps.release.outputs.pr
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cargo update --workspace
          if git diff --quiet -- package-lock.json Cargo.lock; then
            echo "Lock files already in sync."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(repo): sync lock files with the release versions' -- package-lock.json Cargo.lock
          git push
