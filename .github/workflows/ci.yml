name: CI

# Pushes to main run this file through deploy.yml (workflow_call), so CI runs
# once per push; pull requests and manual runs use it directly. The release
# PR's branch (release-please--...) gets no pull request run: its commit only
# bumps versions, and it is tested after the merge inside Deploy. See docs/ci.md.
on:
  pull_request:
    branches-ignore: ['release-please--**']
  workflow_call:
  workflow_dispatch:
    inputs:
      changed_only:
        description: Skip the engine and shader jobs when the tip commit only bumps versions (as a push to main does)
        type: boolean
        default: false

permissions:
  contents: read

# Pull requests (including those from forks) run on GitHub-hosted
# ubuntu-latest runners: code from a pull request never reaches the
# self-hosted runners. Pushes (through deploy.yml) and manual runs use the
# self-hosted ARC runner scale sets (labels small, medium, large, enormous;
# enormous has at most 3 runners). Their image (ghcr.io/actions/actions-runner)
# is a minimal Ubuntu and the runners are ephemeral: every job installs the
# system packages and toolchains it needs (already present on ubuntu-latest,
# where the same apt-get step is a no-op) and caches through actions/cache.
# Every job reads the repository only (job-level permissions), and every
# third-party action is pinned to a full commit SHA (Dependabot updates them).

# github.workflow is the caller's name when deploy.yml runs this file, so a
# pull request's CI and the CI inside a deploy never cancel each other. A
# newer push to a pull request cancels its older run; pushes to main are
# grouped per commit, so two pushes in a row both finish their CI (Deploy
# serializes only its deploy job).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the engine and shader jobs run: not for a release commit
  # that only bumps versions (.github/scripts/engine-relevant.sh). The web and
  # data jobs always run; the web job builds the wasm with the new version and
  # the protocol tests check that every version file agrees.
  changes:
    name: Changed paths
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'small' }}
    permissions:
      contents: read
    outputs:
      engine_relevant: ${{ steps.decide.outputs.engine_relevant }}
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          CHANGED_ONLY: ${{ inputs.changed_only }}
        # push: everything the push brought (before..sha). pull_request: the
        # merge commit against its first parent, the base branch. A manual
        # run checks everything unless changed_only asks for the tip commit.
        # pipefail: a failing script fails this job (and CI) instead of
        # handing the jobs below an empty output.
        run: |
          set -o pipefail
          case "$EVENT" in
            push) base="$BEFORE" ;;
            pull_request) base=$(git rev-parse HEAD^) ;;
            workflow_dispatch) if [ "$CHANGED_ONLY" = true ]; then base=$(git rev-parse HEAD^); else base=""; fi ;;
            *) base="" ;;
          esac
          .github/scripts/engine-relevant.sh "$base" | tee -a "$GITHUB_OUTPUT"

  engine:
    name: Engine (fmt, clippy, tests)
    needs: changes
    # Fail-safe: only an explicit false skips this job.
    if: needs.changes.outputs.engine_relevant != 'false'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'enormous' }}
    permissions:
      contents: read
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      # The ci profile is release with panic = "unwind" (Cargo.toml), which
      # the test harness needs anyway. One cargo test builds the test binary,
      # the plain lib and every example side by side (each a long
      # single-threaded LTO build, so they cost cores, not time), runs the
      # tests and the doctests; the AI match then runs the example binary it
      # built. A separate cargo build or cargo run would compile again: other
      # unit hashes (cargo build against cargo test) or features (-p instead
      # of --workspace).
      - run: cargo clippy --workspace --profile ci --tests --examples -- -D warnings
      - run: cargo test --workspace --profile ci
      - name: Headless AI vs AI match finishes
        run: ./target/ci/examples/ai_vs_ai 3 | tee match.log && grep -q '^winner' match.log

  data:
    name: Rules and tables in sync with data
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'small' }}
    permissions:
      contents: read
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python3 tools/gen_rules.py
      - run: python3 tools/gen_oramap_tables.py
      - run: python3 tools/gen_content_tables.py
      - run: python3 tools/gen_hotkeys.py
      - run: node tools/gen-audio-catalog.mjs
      - run: node tools/gen-guide-outline.mjs
      - run: python3 tools/gen_missions.py
      - run: python3 tools/gen_pixel_art.py
      # The built-in 3D minimal pack: compares the committed archives with a fresh render (PNGs by their pixels).
      - run: python3 tools/gen_minimal3d/generate.py --check
      - run: git diff --exit-code apps/game/js/art/pixel-data.js engine/rules.json apps/game/js/oramap/tables.js apps/game/js/content/tables.js apps/game/js/content/render-facts.js engine/render.json apps/game/js/openra-hotkeys.js apps/game/js/audio/catalog-data.js apps/game/missions packages/protocol/src/coop-missions.js packages/protocol/src/guide-outline.js

  shaders:
    name: WGSL shaders
    needs: changes
    # Fail-safe: only an explicit false skips this job.
    if: needs.changes.outputs.engine_relevant != 'false'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'small' }}
    permissions:
      contents: read
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo run -p shader-check

  web:
    name: Web (wasm build, JS checks, API tests)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'medium' }}
    permissions:
      contents: read
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      # One wasm-pack for every build (it also picks the wasm-bindgen CLI and
      # the wasm-opt it runs): a prebuilt binary, checksum-verified by the
      # action. Installed after rust-cache, so it replaces any cached copy.
      - name: Install wasm-pack
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.13.1
      - run: test "$(wasm-pack --version)" = "wasm-pack 0.13.1"
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      # The Lua interpreter's stack use in the wasm32 build against MAX_LEVELS
      # (engine/src/stack_check.rs) needs its own wasm32 release build of the
      # engine (the stack-probe feature, never in the game). It shares
      # target/wasm32-unknown-unknown/release with wasm-pack, so it starts once
      # wasm-pack's cargo build has written the engine and compiles during
      # wasm-opt and the JS tests; test:luastack below then finds it built.
      # Sharing the target dir is safe for apps/game/pkg: both builds write
      # target/wasm32-unknown-unknown/release, and the probe's build of the
      # lib (with stack-probe) may rewrite release/webra_sim.wasm. It starts
      # only after wasm-pack's cargo build wrote that file (and then waits for
      # cargo's lock on the dir until that build exits); wasm-bindgen reads
      # the file within seconds, while the probe's fat-LTO compile takes
      # minutes. After wasm-bindgen, pkg/ holds its own copy (wasm-opt works
      # there), so nothing later reads release/webra_sim.wasm.
      - name: Build the Lua stack probe in the background
        run: |
          touch "$RUNNER_TEMP/wasm-start"
          (
            until [ target/wasm32-unknown-unknown/release/webra_sim.wasm -nt "$RUNNER_TEMP/wasm-start" ]; do sleep 2; done
            cargo build --release --target wasm32-unknown-unknown -p webra-sim --example lua_stack --features stack-probe
            echo $? > "$RUNNER_TEMP/luastack.status"
          ) > "$RUNNER_TEMP/luastack.log" 2>&1 &
      - run: npm run build:wasm
        env:
          WEBRA_GIT_HASH: ${{ github.sha }}
      # Deploy (deploy.yml) ships this build instead of building its own.
      # Artifacts belong to this run only; one day is enough for the deploy
      # job of the same run and keeps the Actions storage quota free.
      - name: Upload the wasm package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webra-pkg
          path: apps/game/pkg
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - run: npm run check:js
      - run: npm run test:protocol
      - run: npm run test:server
      - run: npm run test:web
      - run: npm run test:tools
      - name: Wait for the Lua stack probe build
        timeout-minutes: 15
        run: |
          until [ -f "$RUNNER_TEMP/luastack.status" ]; do sleep 2; done
          cat "$RUNNER_TEMP/luastack.log"
          exit "$(cat "$RUNNER_TEMP/luastack.status")"
      - run: npm run test:luastack
