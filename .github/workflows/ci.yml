name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# All jobs run on the self-hosted ARC runner scale sets (labels small, medium,
# large, enormous). Their image (ghcr.io/actions/actions-runner) is a minimal
# Ubuntu and the runners are ephemeral: every job installs the system packages
# and toolchains it needs and caches through actions/cache.

# github.workflow is the caller's name when deploy.yml runs this file, so the
# push run of CI and the CI inside a deploy never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (fmt, clippy, tests)
    runs-on: enormous
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config git
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --release --tests --examples -- -D warnings
      - run: cargo test --workspace --release
      - name: Headless AI vs AI match finishes
        run: cargo run -p webra-sim --release --example ai_vs_ai -- 3 | tee match.log && grep -q '^winner' match.log

  data:
    name: Rules and tables in sync with data
    runs-on: small
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/gen_rules.py
      - run: python3 tools/gen_oramap_tables.py
      - run: python3 tools/gen_content_tables.py
      - run: python3 tools/gen_hotkeys.py
      - run: node tools/gen-audio-catalog.mjs
      - run: python3 tools/gen_missions.py
      - run: python3 tools/gen_pixel_art.py
      # The built-in 3D minimal pack: compares the committed archives with a fresh render (PNGs by their pixels).
      - run: python3 tools/gen_minimal3d/generate.py --check
      - run: git diff --exit-code apps/game/js/art/pixel-data.js engine/rules.json apps/game/js/oramap/tables.js apps/game/js/content/tables.js apps/game/js/content/render-facts.js engine/render.json apps/game/js/openra-hotkeys.js apps/game/js/audio/catalog-data.js apps/game/missions packages/protocol/src/coop-missions.js

  shaders:
    name: WGSL shaders
    runs-on: medium
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config git
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p shader-check

  web:
    name: Web (wasm build, JS checks, API tests)
    runs-on: large
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config git
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - run: npm run build:wasm
        env:
          WEBRA_GIT_HASH: ${{ github.sha }}
      # The Lua interpreter's stack use in the wasm32 build against MAX_LEVELS (engine/src/stack_check.rs).
      - run: npm run test:luastack
      - run: npm run check:js
      - run: npm run test:protocol
      - run: npm run test:server
      - run: npm run test:web
      - run: npm run test:tools
