name: Deploy

# Deploys https://webra.sherin.dev (one Cloudflare Worker: static site, game,
# API and Durable Objects) after the full CI passes. See docs/deploy.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The CI halves of two pushes run side by side (ci.yml groups pushes per
# commit); only the deploy job is serialized (its own concurrency group
# below). A second run for the same commit, a manual one say, waits for the
# first instead of running beside it.
concurrency:
  group: deploy-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # The full CI. Jobs it skips (the engine and shader jobs on a release commit
  # that only bumps versions, ci.yml "changes") leave it successful; a failed
  # or cancelled job fails it, and then the deploy job does not run.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare
    needs: ci
    # Off until hosting is set up: set the repository variable DEPLOY_ENABLED
    # to "true" once the secrets below exist (docs/deploy.md).
    # Production deploys only from main, also for a manual workflow_dispatch.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    # Never two deploys at once: a deploy waits for the running one instead
    # of cancelling it halfway through migrations or an upload. GitHub keeps
    # one waiting deploy per group, so a third push replaces (cancels) the
    # second's waiting deploy job; the guard below covers the rest.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Builds nothing: the wasm comes from the CI web job of this run.
    runs-on: small
    environment:
      name: production
      url: https://webra.sherin.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Error reports (docs/deploy.md, "Error reports") are opt-in: only with
      # the repository variable SENTRY_DSN set do the game, the website and the
      # Worker report anything; unset, the build and the Worker send nothing.
      WEBRA_ENV: production
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
      SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
      # Account email (docs/deploy.md, "Email") is opt-in too: only with the
      # repository variable EMAIL_FROM set (the sender, on a domain onboarded
      # to Cloudflare Email Sending; needs the Workers Paid plan) does the
      # deploy add the send_email binding. Unset, the Worker sends no email.
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
    steps:
      # The self-hosted runner image is a minimal Ubuntu (see ci.yml). git
      # for the checkout and build-dist.mjs (the commit in version.json).
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v4

      # Pushes deploy in order: while this job waited for the previous deploy
      # (or its CI ran), a newer commit may have reached main, and its own run
      # deploys it. Deploying this one after it would roll production back,
      # so every step below is skipped and the job still succeeds.
      - name: Check that this commit is still the tip of main
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at $tip now, not $GITHUB_SHA: skipping this deploy, the newer commit's run deploys."
          fi

      # The engine as CI's web job built it (npm run build:wasm, release
      # profile, WEBRA_GIT_HASH = this commit), from this run only.
      - name: Download the wasm package
        if: steps.tip.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: webra-pkg
          path: apps/game/pkg

      - uses: actions/setup-node@v4
        if: steps.tip.outputs.current == 'true'
        with:
          node-version: '22'
          cache: npm

      - if: steps.tip.outputs.current == 'true'
        run: npm ci

      # Fails when apps/game/pkg/webra_sim_bg.wasm is missing.
      - name: Assemble dist/
        if: steps.tip.outputs.current == 'true'
        run: npm run build

      - name: Check secrets and wrangler
        if: steps.tip.outputs.current == 'true'
        working-directory: apps/server
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required (see docs/deploy.md)."
            exit 1
          fi
          # Use the wrangler version pinned in package-lock.json, never a fresh download.
          npx --no-install wrangler --version

      - name: Apply D1 migrations
        if: steps.tip.outputs.current == 'true'
        working-directory: apps/server
        run: |
          if [ -d migrations ]; then
            npx --no-install wrangler d1 migrations apply webra --remote
          else
            echo "No apps/server/migrations directory, skipping."
          fi

      # Replays in accounts live in the R2 bucket bound as REPLAYS
      # (wrangler.jsonc r2_buckets; apps/server/test/replays.test.mjs keeps
      # the name here in step). The Worker cannot deploy with a binding to a
      # missing bucket, so it is created once, here, before the deploy; on
      # every later run it exists and nothing changes. The API token needs
      # "Workers R2 Storage: Edit" (docs/deploy.md).
      - name: Create the replays R2 bucket when missing
        if: steps.tip.outputs.current == 'true'
        working-directory: apps/server
        run: |
          bucket=webra-replays
          if npx --no-install wrangler r2 bucket info "$bucket" >/dev/null 2>&1; then
            echo "R2 bucket $bucket exists."
          elif out=$(npx --no-install wrangler r2 bucket create "$bucket" 2>&1); then
            echo "$out"
            echo "Created R2 bucket $bucket."
          elif echo "$out" | grep -qi 'already exists'; then
            echo "R2 bucket $bucket exists."
          else
            echo "$out"
            echo "::error::Could not create the R2 bucket $bucket (the API token needs Workers R2 Storage: Edit, docs/deploy.md)."
            exit 1
          fi

      # Releases, source files and deploy markers in Sentry need an org auth
      # token (secret SENTRY_AUTH_TOKEN) and the variables SENTRY_ORG and
      # SENTRY_PROJECT; without the token these steps are skipped.
      - name: Create the Sentry release and upload the sources
        if: steps.tip.outputs.current == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ vars.SENTRY_URL || 'https://sentry.vitrion.dev' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "No SENTRY_AUTH_TOKEN secret: skipping the Sentry release and source upload."
            exit 0
          fi
          if [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is set, so the repository variables SENTRY_ORG and SENTRY_PROJECT are required (docs/deploy.md)."
            exit 1
          fi
          release=$(node tools/sentry-config.mjs release)
          npx --yes @sentry/cli@3.8.0 releases new "$release"
          # Our modules are served as they are (no bundler) and the SDK with
          # its source map: everything under dist/ by its URL path.
          npx --yes @sentry/cli@3.8.0 sourcemaps upload --release "$release" --url-prefix '~/' dist

      - name: Deploy the Worker
        if: steps.tip.outputs.current == 'true'
        working-directory: apps/server
        # The SENTRY_* variables of the Worker (src/telemetry.js) come from the same configuration as the game's.
        # With EMAIL_FROM, email-config.mjs writes wrangler.deploy.jsonc (the binding) and selects it.
        run: |
          vars=$(node ../../tools/sentry-config.mjs worker-vars)
          email=$(node ../../tools/email-config.mjs wrangler-args)
          read -r -a email_args <<< "$email"
          npx --no-install wrangler deploy $vars "${email_args[@]}"

      - name: Mark the Sentry release deployed
        if: steps.tip.outputs.current == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ vars.SENTRY_URL || 'https://sentry.vitrion.dev' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "No SENTRY_AUTH_TOKEN secret: skipping the Sentry deploy marker."
            exit 0
          fi
          release=$(node tools/sentry-config.mjs release)
          environment=$(node tools/sentry-config.mjs environment)
          npx --yes @sentry/cli@3.8.0 releases finalize "$release"
          npx --yes @sentry/cli@3.8.0 deploys new --release "$release" --env "$environment" --url https://webra.sherin.dev
