name: Deploy

# Deploys https://webra.sherin.dev (one Cloudflare Worker: static site, game,
# API and Durable Objects) after the full CI passes. See docs/deploy.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the running deploy
# instead of cancelling it halfway through migrations or an upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare
    needs: ci
    # Off until hosting is set up: set the repository variable DEPLOY_ENABLED
    # to "true" once the secrets below exist (docs/deploy.md).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://webra.sherin.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Error reports (docs/deploy.md, "Error reports"): a production build
      # reports to the default DSN of tools/sentry-config.mjs unless the
      # repository variables say otherwise (SENTRY_DSN "off" turns them off).
      WEBRA_ENV: production
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
      SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build the engine (WebAssembly)
        run: npm run build:wasm
        env:
          WEBRA_GIT_HASH: ${{ github.sha }}

      - name: Assemble dist/
        run: npm run build

      - name: Check secrets and wrangler
        working-directory: apps/server
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required (see docs/deploy.md)."
            exit 1
          fi
          # Use the wrangler version pinned in package-lock.json, never a fresh download.
          npx --no-install wrangler --version

      - name: Apply D1 migrations
        working-directory: apps/server
        run: |
          if [ -d migrations ]; then
            npx --no-install wrangler d1 migrations apply webra --remote
          else
            echo "No apps/server/migrations directory, skipping."
          fi

      # Releases, source files and deploy markers in Sentry need an org auth
      # token (secret SENTRY_AUTH_TOKEN) and the variables SENTRY_ORG and
      # SENTRY_PROJECT; without the token these steps are skipped.
      - name: Create the Sentry release and upload the sources
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ vars.SENTRY_URL || 'https://sentry.vitrion.dev' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "No SENTRY_AUTH_TOKEN secret: skipping the Sentry release and source upload."
            exit 0
          fi
          if [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is set, so the repository variables SENTRY_ORG and SENTRY_PROJECT are required (docs/deploy.md)."
            exit 1
          fi
          release=$(node tools/sentry-config.mjs release)
          npx --yes @sentry/cli@3.8.0 releases new "$release"
          # Our modules are served as they are (no bundler) and the SDK with
          # its source map: everything under dist/ by its URL path.
          npx --yes @sentry/cli@3.8.0 sourcemaps upload --release "$release" --url-prefix '~/' dist

      - name: Deploy the Worker
        working-directory: apps/server
        # The SENTRY_* variables of the Worker (src/telemetry.js) come from the same configuration as the game's.
        run: |
          vars=$(node ../../tools/sentry-config.mjs worker-vars)
          npx --no-install wrangler deploy $vars

      - name: Mark the Sentry release deployed
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ vars.SENTRY_URL || 'https://sentry.vitrion.dev' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "No SENTRY_AUTH_TOKEN secret: skipping the Sentry deploy marker."
            exit 0
          fi
          release=$(node tools/sentry-config.mjs release)
          environment=$(node tools/sentry-config.mjs environment)
          npx --yes @sentry/cli@3.8.0 releases finalize "$release"
          npx --yes @sentry/cli@3.8.0 deploys new --release "$release" --env "$environment" --url https://webra.sherin.dev
