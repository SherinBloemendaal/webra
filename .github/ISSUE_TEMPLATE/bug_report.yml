name: Bug report
description: Something in the game, the editor, the site or the server does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems go through private vulnerability reporting instead (SECURITY.md), never here.
        Do not attach files of the original commercial game or anything extracted from them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a skirmish on ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Skirmish or campaign
        - Online game or lobby
        - Map editor
        - Website or account
        - Original content or texture packs
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version in the game menu, or the commit from /version.json.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11, Safari 26 on iPhone, ...
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Error messages, a replay or a performance capture (debug menu, Alt + P; it holds no names, chat or account), screenshots.
