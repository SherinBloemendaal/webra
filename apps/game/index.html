<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WebRA</title>
    <link rel="icon" href="brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="brand/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
    <!-- The fonts (css/fonts.css, self-hosted, OFL): the two faces of the first screen load at once. -->
    <link rel="preload" href="fonts/barlow-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/barlow-condensed-latin-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/controls.css" />
    <link rel="stylesheet" href="css/patterns.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/minimap.css" />
    <link rel="stylesheet" href="css/lobby.css" />
    <link rel="stylesheet" href="css/online.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/powers.css" />
    <link rel="stylesheet" href="css/audio.css" />
    <link rel="stylesheet" href="css/content.css" />
    <link rel="stylesheet" href="css/debug.css" />
    <link rel="stylesheet" href="css/releasenotes.css" />
    <link rel="stylesheet" href="css/touch.css" />
    <link rel="stylesheet" href="css/commandbar.css" />
    <link rel="stylesheet" href="css/records.css" />
    <link rel="stylesheet" href="css/endgame.css" />
    <link rel="stylesheet" href="css/account.css" />
    <link rel="stylesheet" href="css/help.css" />
    <link rel="stylesheet" href="css/tooltip.css" />
    <link rel="stylesheet" href="css/worldtooltip.css" />
    <link rel="stylesheet" href="css/netwarn.css" />
    <link rel="stylesheet" href="css/campaign.css" />
    <link rel="stylesheet" href="css/maplens.css" />
    <link rel="stylesheet" href="css/spawns.css" />
    <link rel="stylesheet" href="css/startmenu.css" />
    <link rel="stylesheet" href="css/boxchooser.css" />
    <link rel="stylesheet" href="css/loading.css" />
    <link rel="stylesheet" href="css/gamemenu.css" />
    <link rel="stylesheet" href="css/guide.css" />
  </head>
  <body>
    <!-- The start screen: the main menu (js/startmenu.js) over the skirmish lobby (js/lobby.js) -->
    <section id="menu" aria-label="Start screen">
      <nav id="start-nav" class="start-nav" aria-label="Main menu">
        <h1 class="start-logo ui-brand"><img class="ui-brand-emblem" src="brand/favicon.svg" alt="" width="32" height="32" />WEB<span>RA</span></h1>
        <!-- Play: the skirmish below, online play (js/online.js, loaded on demand) and the campaign -->
        <div class="start-group start-play" role="group" aria-label="Play">
          <button id="start-skirmish" class="start-item" type="button" aria-current="page" title="Set up a game against the AI (this screen)">Skirmish</button>
          <button id="online-button" class="start-item start-primary" type="button" title="Play against other people over the internet" hidden>Play online</button>
          <button id="campaign-button" class="start-item" type="button" title="Play the Allied and Soviet campaigns and the expansion missions" hidden>Campaign</button>
        </div>
        <!-- Saved games and replays (js/records.js) -->
        <div id="records-entry" class="start-group start-records" role="group" aria-label="Saved games" hidden></div>
        <div class="start-end">
          <!-- The account: sign in, who is signed in, message of the day (js/account/ui.js) -->
          <div id="account-entry" aria-label="Account" hidden></div>
          <div class="start-more">
            <button id="start-more-button" class="start-item" type="button" aria-expanded="false" aria-controls="start-more-list">More</button>
            <div id="start-more-list" class="start-more-list" role="group" aria-label="More" hidden>
              <!-- Original content (graphics and sounds from the player's own copy) and texture packs (js/content/panel.js) -->
              <button id="start-content" class="start-more-item" type="button" title="Original Red Alert graphics and sounds, texture packs" aria-haspopup="dialog" aria-expanded="false" hidden>Original content</button>
              <button id="start-sound" class="start-more-item" type="button" aria-haspopup="dialog" hidden>Sound and music</button>
              <button id="start-notes" class="start-more-item" type="button" aria-haspopup="dialog" hidden>Release notes</button>
              <button id="start-stress" class="start-more-item" type="button" title="Spawn many units to measure performance">Stress test</button>
            </div>
          </div>
        </div>
      </nav>
      <div id="skirmish"></div>
    </section>

    <!-- Online multiplayer (js/online.js, loaded on demand by js/main.js) -->
    <section id="online-root" hidden></section>

    <!-- The campaign's mission browser (js/campaign/menu.js) -->
    <section id="campaign-root" hidden></section>

    <div id="app" hidden>
      <main id="field">
        <canvas id="view"></canvas>
        <!-- The top-left HUD in one column, so nothing in it overlaps (css/style.css #hud-stack):
             the status line, the weather badge, the mission objectives (js/campaign/view.js), then
             the support power bar and the support power timers side by side (js/powers.js, js/powertimers.js). -->
        <div id="hud-stack">
          <div id="hud"></div>
          <div id="weather" role="status" aria-live="polite" hidden></div>
          <div id="hud-row"></div>
        </div>
        <div class="hud-buttons">
          <!-- Phones: show or hide the build sidebar drawer (js/layout.js) -->
          <button id="sidebar-toggle" class="hud-button" type="button" aria-controls="sidebar" hidden>Map</button>
          <button id="menu-button" class="hud-button" type="button" hidden>Menu</button>
        </div>
      </main>
      <aside id="sidebar"></aside>
    </div>

    <!-- Defeat, victory and the end of the game, built by js/endgame.js -->
    <section id="gameover" hidden></section>

    <!-- End-game statistics, built by js/stats.js -->
    <section id="stats-screen" class="overlay" hidden></section>

    <!-- In-game menu (Esc), built by js/gamemenu.js -->
    <section id="game-menu" class="overlay" hidden></section>

    <!-- The loading screen from Start to the game's first frame, built by js/loadingscreen.js -->
    <section id="loading" aria-busy="false" hidden></section>

    <div id="version" title="WebRA version"></div>

    <!-- Short messages, over the lobby and the game (js/main.js showToast) -->
    <div id="toast" role="status" hidden></div>

    <!-- Sound settings and original content install (js/audio/panel.js) -->
    <button id="audio-button" type="button" title="Sound settings and original Red Alert content" aria-haspopup="dialog" aria-expanded="false" hidden>Sound</button>
    <section id="audio-panel" hidden></section>
    <!-- Music player (js/audio/musicplayer.js), opened from the Sound dialog -->
    <section id="music-panel" hidden></section>

    <!-- Original content (graphics and sounds from the player's own copy) and texture packs (js/content/panel.js):
         the corner button on the online and campaign screens; the start screen has it in More, a game in its menu -->
    <button id="content-button" type="button" title="Original Red Alert graphics and sounds, texture packs" aria-haspopup="dialog" aria-expanded="false" hidden>Original content</button>
    <section id="content-panel" hidden></section>

    <!-- Release notes and "What's new" (js/releasenotes-dialog.js) -->
    <section id="release-notes" hidden></section>

    <script type="module" src="js/telemetry/boot.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
