<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WebRA</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/minimap.css" />
    <link rel="stylesheet" href="css/lobby.css" />
    <link rel="stylesheet" href="css/online.css" />
    <link rel="stylesheet" href="css/powers.css" />
    <link rel="stylesheet" href="css/audio.css" />
    <link rel="stylesheet" href="css/content.css" />
    <link rel="stylesheet" href="css/debug.css" />
    <link rel="stylesheet" href="css/releasenotes.css" />
    <link rel="stylesheet" href="css/touch.css" />
    <link rel="stylesheet" href="css/commandbar.css" />
    <link rel="stylesheet" href="css/records.css" />
    <link rel="stylesheet" href="css/account.css" />
    <link rel="stylesheet" href="css/help.css" />
  </head>
  <body>
    <!-- Pre-game lobby, built by js/lobby.js -->
    <section id="menu"></section>

    <!-- Online multiplayer (js/online.js, loaded on demand by js/main.js) -->
    <button id="online-button" type="button" title="Play against other people over the internet" hidden>Play online</button>
    <section id="online-root" hidden></section>

    <!-- Saved games and replays (js/records.js) -->
    <div id="records-entry" hidden></div>

    <div id="app" hidden>
      <main id="field">
        <canvas id="view"></canvas>
        <div id="hud"></div>
        <div id="weather" role="status" aria-live="polite" hidden></div>
        <div class="hud-buttons">
          <!-- Phones: show or hide the build sidebar drawer (js/layout.js) -->
          <button id="sidebar-toggle" class="hud-button" type="button" aria-controls="sidebar" hidden>Map</button>
          <button id="menu-button" class="hud-button" type="button" title="Game menu (Esc)" hidden>Menu</button>
        </div>
      </main>
      <aside id="sidebar"></aside>
    </div>

    <section id="gameover" hidden>
      <div class="menu-card">
        <h1 id="gameover-title">Mission accomplished</h1>
        <button id="again" class="primary" type="button">Play again</button>
        <button id="gameover-replay" type="button" hidden>Download replay</button>
      </div>
    </section>

    <!-- In-game menu (Esc), built by js/gamemenu.js -->
    <section id="game-menu" class="overlay" hidden></section>

    <div id="version" title="WebRA version"></div>

    <!-- The account on the start screen: sign in, who is signed in, message of the day (js/account/ui.js) -->
    <aside id="account-entry" aria-label="Account" hidden></aside>

    <!-- Short messages, over the lobby and the game (js/main.js showToast) -->
    <div id="toast" role="status" hidden></div>

    <!-- Sound settings and original content install (js/audio/panel.js) -->
    <button id="audio-button" type="button" title="Sound settings and original Red Alert content" aria-haspopup="dialog" aria-expanded="false" hidden>Sound</button>
    <section id="audio-panel" hidden></section>

    <!-- Original content (graphics and sounds from the player's own copy) and texture packs (js/content/panel.js) -->
    <button id="content-button" type="button" title="Original Red Alert graphics and sounds, texture packs" aria-haspopup="dialog" aria-expanded="false" hidden>Original content</button>
    <section id="content-panel" hidden></section>

    <!-- Release notes and "What's new" (js/releasenotes-dialog.js) -->
    <section id="release-notes" hidden></section>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
