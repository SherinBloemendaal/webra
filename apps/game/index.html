<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebRA</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/lobby.css" />
    <link rel="stylesheet" href="css/online.css" />
    <link rel="stylesheet" href="css/powers.css" />
    <link rel="stylesheet" href="css/audio.css" />
    <link rel="stylesheet" href="css/debug.css" />
  </head>
  <body>
    <!-- Pre-game lobby, built by js/lobby.js -->
    <section id="menu"></section>

    <!-- Online multiplayer (js/online.js, loaded on demand by js/main.js) -->
    <button id="online-button" type="button" title="Play against other people over the internet" hidden>Play online</button>
    <section id="online-root" hidden></section>

    <div id="app" hidden>
      <main id="field">
        <canvas id="view"></canvas>
        <div id="hud"></div>
        <button id="menu-button" class="hud-button" type="button" title="Game menu (Esc)" hidden>Menu</button>
        <div id="toast" role="status" hidden></div>
      </main>
      <aside id="sidebar"></aside>
    </div>

    <section id="gameover" hidden>
      <div class="menu-card">
        <h1 id="gameover-title">Mission accomplished</h1>
        <button id="again" class="primary" type="button">Play again</button>
      </div>
    </section>

    <!-- In-game menu (Esc), built by js/gamemenu.js -->
    <section id="game-menu" class="overlay" hidden></section>

    <div id="version" title="WebRA version"></div>

    <!-- Sound settings and original content install (js/audio/panel.js) -->
    <button id="audio-button" type="button" title="Sound settings and original Red Alert content" aria-haspopup="dialog" aria-expanded="false" hidden>Sound</button>
    <section id="audio-panel" hidden></section>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
