<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebRA</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/lobby.css" />
    <link rel="stylesheet" href="css/online.css" />
  </head>
  <body>
    <!-- Pre-game lobby, built by js/lobby.js -->
    <section id="menu"></section>

    <!-- Online multiplayer (js/online.js, loaded on demand by js/main.js) -->
    <button id="online-button" type="button" title="Play against other people over the internet" hidden>Play online</button>
    <section id="online-root" hidden></section>

    <div id="app" hidden>
      <main id="field">
        <canvas id="view"></canvas>
        <div id="hud"></div>
        <button id="pause-button" class="hud-button" type="button" title="Pause (P)" hidden>Pause</button>
      </main>
      <aside id="sidebar"></aside>
    </div>

    <section id="pause" class="overlay" hidden>
      <div class="menu-card">
        <h1>Paused</h1>
        <p class="tagline">Press P to resume.</p>
        <button id="resume" class="primary" type="button">Resume</button>
        <button id="quit" type="button">Quit to lobby</button>
      </div>
    </section>

    <section id="gameover" hidden>
      <div class="menu-card">
        <h1 id="gameover-title">Mission accomplished</h1>
        <button id="again" class="primary" type="button">Play again</button>
      </div>
    </section>

    <div id="version" title="WebRA version"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
