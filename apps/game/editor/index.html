<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Resolve URLs against /play/ (the game's files: shaders, sheets, the
         engine), whichever spelling of the editor's URL loaded the page. -->
    <base href="/play/" />
    <title>WebRA Map Editor</title>
    <!-- The game's theme tokens, base sheet and themed controls, then the editor's own. -->
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/controls.css" />
    <link rel="stylesheet" href="css/tooltip.css" />
    <link rel="stylesheet" href="css/maplens.css" />
    <link rel="stylesheet" href="editor/editor.css" />
  </head>
  <body class="editor">
    <header id="topbar">
      <a class="brand" href="./" title="Back to the game">Web<span>RA</span> <small>Map Editor</small></a>
      <nav id="commands" aria-label="Map"></nav>
      <span class="spacer"></span>
      <span id="modded-badge" class="badge modded" hidden title="This map has rules overrides">MODDED</span>
      <span id="save-state" class="muted" role="status"></span>
      <nav id="actions" aria-label="Play and publish"></nav>
    </header>

    <div id="workspace">
      <aside id="tools" aria-label="Tools"></aside>

      <main id="stage">
        <canvas id="view" tabindex="0" aria-label="Map"></canvas>
        <div id="labels" aria-hidden="true"></div>
        <div id="viewbar" aria-label="View"></div>
        <div id="status" role="status"></div>
        <div id="boot" class="boot">Loading the engine...</div>
      </main>

      <aside id="side" aria-label="Map panels">
        <canvas id="minimap" aria-label="Minimap (click or drag with any mouse button to move the view, wheel to zoom)"></canvas>
        <div class="tabs" role="tablist" aria-label="Panels"></div>
        <div id="panes"></div>
      </aside>
    </div>

    <div id="toast" role="status" aria-live="polite" hidden></div>
    <input id="file-input" type="file" accept=".json,application/json,.oramap" hidden />

    <script type="module" src="js/telemetry/boot.js"></script>
    <script type="module" src="editor/editor.js"></script>
  </body>
</html>
