<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Resolve URLs against /play/ so the game's renderer finds its shaders. -->
    <base href="../" />
    <title>WebRA Map Editor</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="editor/editor.css" />
  </head>
  <body class="editor">
    <header id="topbar">
      <a class="brand" href="./" title="Back to the game">Web<span>RA</span> <small>Map Editor</small></a>
      <nav class="group" aria-label="File">
        <button type="button" data-cmd="new" title="New map (Ctrl+Alt+N)">New</button>
        <button type="button" data-cmd="open" title="Open a .webra-map.json file or import an OpenRA .oramap map (Ctrl+O)">Open</button>
        <button type="button" data-cmd="save" title="Download as .webra-map.json (Ctrl+S)">Save</button>
        <button type="button" data-cmd="png" title="Export a PNG preview">PNG</button>
      </nav>
      <nav class="group" aria-label="Edit">
        <button type="button" data-cmd="undo" title="Undo (Ctrl+Z)">Undo</button>
        <button type="button" data-cmd="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      </nav>
      <nav class="group" aria-label="Play">
        <button type="button" data-cmd="test" class="primary" title="Test play this map in the game (Ctrl+Enter)">Test play</button>
        <button type="button" data-cmd="publish" title="Publish to the map server">Publish</button>
      </nav>
      <span id="modded-badge" class="badge modded" hidden title="This map has rules overrides">MODDED</span>
      <span id="save-state" class="muted"></span>
      <button type="button" data-cmd="help" class="help-button" title="Keyboard shortcuts (?)">?</button>
    </header>

    <div id="workspace">
      <aside id="tools" aria-label="Tools"></aside>

      <main id="stage">
        <canvas id="view" tabindex="0" aria-label="Map"></canvas>
        <div id="labels" aria-hidden="true"></div>
        <div id="status"></div>
        <div id="boot" class="boot">Loading the engine...</div>
      </main>

      <aside id="props">
        <canvas id="minimap" aria-label="Minimap (click to move the view)"></canvas>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="map" class="active">Map</button>
          <button type="button" role="tab" data-tab="actors">Actors</button>
          <button type="button" role="tab" data-tab="rules">Rules <span id="rules-count" class="dot" hidden></span></button>
          <button type="button" role="tab" data-tab="online">Online</button>
        </div>
        <section class="pane" data-pane="map"></section>
        <section class="pane" data-pane="actors" hidden></section>
        <section class="pane" data-pane="rules" hidden></section>
        <section class="pane" data-pane="online" hidden></section>
      </aside>
    </div>

    <div id="toast" role="status" aria-live="polite" hidden></div>
    <input id="file-input" type="file" accept=".json,application/json,.oramap" hidden />

    <script type="module" src="js/telemetry/boot.js"></script>
    <script type="module" src="editor/editor.js"></script>
  </body>
</html>
