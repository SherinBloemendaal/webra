[package]
name = "webra-sim"
version = "0.8.0"
edition = "2021"
description = "Deterministic RTS simulation for WebRA, compiled to WebAssembly"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"
# Pure Rust math (a musl port): the same results on every platform, for mission scripts.
libm = "0.2"
